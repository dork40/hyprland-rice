# Used while the screen timeout is switched OFF (Waybar button):
# no screen-off timer, but still lock with hyprlock before the computer sleeps.

general {
    ignore_dbus_inhibit = false     # videos/fullscreen apps can still keep the screen on
    ignore_systemd_inhibit = true   # "playing audio" sleep blocks don't keep the screen on
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session      # lock before the computer sleeps
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
