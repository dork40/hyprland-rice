# Turn the screen and keyboard backlight off after 15 minutes without input
# (no lock and no suspend for that, so audio keeps playing).
# Going to sleep (closing the lid, or Sleep in the power menu) locks with hyprlock first.

general {
    ignore_dbus_inhibit = false     # videos/fullscreen apps can still keep the screen on
    ignore_systemd_inhibit = true   # "playing audio" sleep blocks don't keep the screen on
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session      # lock before the laptop sleeps
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/screen-power.sh off
    on-resume = ~/.config/hypr/scripts/screen-power.sh on
}
